function replaceStarterOldNameDeep(value){
  if(Array.isArray(value)) return value.map(replaceStarterOldNameDeep);
  if(value && typeof value === "object"){
    const out={};
    for(const [k,v] of Object.entries(value)) out[k]=replaceStarterOldNameDeep(v);
    return out;
  }
  if(typeof value === "string" && value.trim()===STARTER_OLD_NAME) return STARTER_NEW_NAME;
  return value;
}

async function purgeStarterOldNameEverywhere(){
  try{
    // 1) scoreboard/state
    const stateSnap=await SCOREBOARD_REF.once("value");
    const fixedState=replaceStarterOldNameDeep(stateSnap.val()||{});
    await SCOREBOARD_REF.set(fixedState);

    // 2) scoreboard/teamMasters
    const masterSnap=await TEAM_MASTERS_REF.once("value");
    const fixedMasters=replaceStarterOldNameDeep(masterSnap.val()||{});
    await TEAM_MASTERS_REF.set(fixedMasters);

    // 3) scoreboard/vision (starter snapshot / playerName / assetsを含む)
    const visionSnap=await VISION_REF.once("value");
    const fixedVision=replaceStarterOldNameDeep(visionSnap.val()||{});
    await VISION_REF.set(fixedVision);

    // 4) browser localStorage
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key) continue;
      const raw=localStorage.getItem(key);
      if(!raw || !raw.includes(STARTER_OLD_NAME)) continue;
      try{
        const parsed=JSON.parse(raw);
        localStorage.setItem(key,JSON.stringify(replaceStarterOldNameDeep(parsed)));
      }catch(_){
        localStorage.setItem(key,raw.split(STARTER_OLD_NAME).join(STARTER_NEW_NAME));
      }
    }

    // current in-memory objects
    if(typeof state!=="undefined" && state){
      const fixed=replaceStarterOldNameDeep(state);
      Object.keys(state).forEach(k=>delete state[k]);
      Object.assign(state,fixed);
    }
    if(typeof visionState!=="undefined" && visionState){
      visionState=replaceStarterOldNameDeep(visionState);
    }
    if(typeof teamMastersCache!=="undefined" && teamMastersCache){
      teamMastersCache=replaceStarterOldNameDeep(teamMastersCache);
    }

    console.log("旧氏名データを完全移行しました:",STARTER_OLD_NAME,"→",STARTER_NEW_NAME);
  }catch(e){
    console.error("旧氏名データ移行失敗",e);
  }
}

let visionPendingPatch=null;

function applyVisionLocalPatch(patch){
  const next={...visionState};
  for(const [key,value] of Object.entries(patch)){
    if(key.includes("/")){
      const parts=key.split("/");let target=next;
      for(let i=0;i<parts.length-1;i++)target=target[parts[i]]={...(target[parts[i]]||{})};
      target[parts.at(-1)]=value;
    }else next[key]=value;
  }
  visionState=next;updateVisionStatus();
  return next;
}
async function quickVisionUpdate(patch){

  }
}

function pushHistory() {
  if (isHistoryMoving) return;

  undoStack.push(JSON.parse(JSON.stringify(state)));

  if (undoStack.length > 50) {
    undoStack.shift();
  }

  redoStack = [];
}

function getYoutubeStateFromState() {
  return {
    showRunning: !!state.showRunning,

let lastSentCommonJson = null;
let lastSentYoutubeJson = null;
function save() {
  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  if (channel) {
    channel.postMessage({
      type: "scoreboard-update",
      state
    });
  }

  if (!isApplyingRemoteState) {
    const commonState = getCommonScoreboardState();
    youtubeState = getYoutubeStateFromState();
    // 比較用データに計測情報を混ぜない。操作内容が同じなら送信しない。
    const commonJson = JSON.stringify(commonState);
    const youtubeJson = JSON.stringify(youtubeState);
    if (commonJson !== lastSentCommonJson) {
      const previousJson = lastSentCommonJson;
      lastSentCommonJson = commonJson;
      let previous = null;
      try { previous = previousJson ? JSON.parse(previousJson) : null; } catch (_e) {}
      if (previous) delete previous.__latencyProbe;
      const changedKeys = previous ? [...new Set([...Object.keys(previous), ...Object.keys(commonState)])]
        .filter(k => JSON.stringify(previous[k]) !== JSON.stringify(commonState[k])) : [];
      // カウント等の独立した項目のみ差分送信。複雑な変更は従来方式を維持。
      const partialKeys = ["balls", "strikes", "outs", "bases", "pitchCounts", "inning", "half", "visitorScore", "homeScore"];
      const canPatch = previous && changedKeys.length > 0 && changedKeys.every(k => partialKeys.includes(k));
      const seq = (window.__latencyProbeSeq = (window.__latencyProbeSeq || 0) + 1);
      const probe = { sentAt: Date.now(), seq };
      const perfStarted = performance.now();
      const payload = canPatch ? { __latencyProbe: probe } : { ...commonState, __latencyProbe: probe };
      if (canPatch) for (const key of changedKeys) payload[key] = commonState[key] ?? null;
      console.log(`[速度計測][操作盤] 送信開始 seq=${seq} ${canPatch ? "差分:" + changedKeys.join(",") : "通常送信"}`);
      const sendTask = canPatch ? SCOREBOARD_REF.update(payload) : SCOREBOARD_REF.set(payload);
      sendTask.then(() => {
        console.log(`[速度計測][操作盤] Firebase送信完了 seq=${seq} ${Math.round(performance.now() - perfStarted)}ms`);
      }).catch(err => {
        lastSentCommonJson = null;
        console.error("スコア送信失敗:", err);
      });
    }
    if (youtubeJson !== lastSentYoutubeJson) {
      lastSentYoutubeJson = youtubeJson;
      YOUTUBE_REF.set(youtubeState).catch(err => {
        lastSentYoutubeJson = null;
        console.error("YouTube状態送信失敗:", err);
      });
    }
  }

  render();
}

function allReset() {
  pushHistory();

  // チーム情報・オーダー・選手マスタは維持し、試合の得点とカウントだけをリセットする
  state.visitorScore = 0;
  state.homeScore = 0;

  state.strikes = 0;
  state.outs = 0;
  state.bases = { first:false, second:false, third:false };

  // イニング別得点もリセット（チーム名は維持）
  if (!state.running) state.running = {};
  state.running.visitorName = state.teamInfo?.visitor?.fullName || state.running.visitorName || state.visitorName || "";
  state.running.homeName = state.teamInfo?.home?.fullName || state.running.homeName || state.homeName || "";
  state.running.visitor = ["","","","","","","","","","",""];
  state.running.home = ["","","","","","","","","","",""];

  // 新しい試合開始時の位置へ戻す
  state.inning = 1;
  state.half = "表";
  state.currentBatter = { visitor:0, home:0 };
  state.pitchCounts = { visitor:{}, home:{} };

  save();

  // YouTube表示側の「本日の最高球速」を全投手分リセット

  firebase.database().ref("scoreboard/pitchSpeedReset").set({

pushHistory();
  if (delta > 0) {

  } else {

    else { state.inning = Math.max(1, state.inning - 1); state.half = "裏"; }
  }
  save();
}
function changeScore(delta) {
pushHistory();
  const scoreKey = getBattingSide() === "visitor" ? "visitorScore" : "homeScore";
  const runSide = getBattingSide();
  const inningIndex = Math.max(0, Math.min(11, state.inning - 1));

  const currentScore = Number(state[scoreKey] || 0);
  const nextScore = Math.max(0, currentScore + delta);
  const actualDelta = nextScore - currentScore;

  state[scoreKey] = nextScore;

  if (!state.running) {
    state.running = {
      visitorName: state.visitorName || "大",
      homeName: state.homeName || "火",
      visitor: ["","","","","","","","","","","",""],
      home: ["","","","","","","","","","","",""]
    };
  }

  const currentInningScore = Number(state.running[runSide][inningIndex] || 0);
  const nextInningScore = Math.max(0, currentInningScore + actualDelta);

  state.running[runSide][inningIndex] =
    nextInningScore === 0 ? "" : String(nextInningScore);

  save();
}

function addRuns(count) {
  const scoreKey = getBattingSide() === "visitor" ? "visitorScore" : "homeScore";
  const runSide = getBattingSide();
  const inningIndex = Math.max(0, Math.min(11, state.inning - 1));

  state[scoreKey] = Number(state[scoreKey] || 0) + count;

  if (!state.running) {
    state.running = {
      visitorName: state.visitorName || "大",
      homeName: state.homeName || "火",
      visitor: ["","","","","","","","","","","",""],
      home: ["","","","","","","","","","","",""]
    };
  }

  const current = Number(state.running[runSide][inningIndex] || 0);
  state.running[runSide][inningIndex] = String(current + count);
}

function resetBSOnly() {
  state.balls = 0;
  state.strikes = 0;
}

function addOut() {
  state.outs = Number(state.outs || 0) + 1;

  if (state.outs >= 3) {
    endHalfInning(false);
  }
}

function endHalfInning(advanceBatterFlag) {
  const runSide = getBattingSide();
  const inningIndex = Math.max(0, Math.min(11, state.inning - 1));

  if (!state.running) {
    state.running = {
      visitorName: state.visitorName || "大",
      homeName: state.homeName || "火",
      visitor: ["","","","","","","","","","","",""],
      home: ["","","","","","","","","","","",""]
    };
  }

  if (
    state.running[runSide][inningIndex] === "" ||
    state.running[runSide][inningIndex] == null
  ) {
    state.running[runSide][inningIndex] = "0";
  }

  if (advanceBatterFlag) {
    advanceBatter(runSide);
  }

  state.balls = 0;
  state.strikes = 0;
  state.outs = 0;
  state.bases = { first:false, second:false, third:false };

  if (state.half === "表") {
    state.half = "裏";
  } else {
    state.inning = Math.min(15, state.inning + 1);
    state.half = "表";
  }

  save();
}

function playStrike() {
  pushHistory();

addPitchCount(1);

  const side = getBattingSide();

  if (state.strikes >= 2) {
    recordBatterStat(side,{atBat:1});
    resetBSOnly();
    advanceBatter(side);
    addOut();

    if (state.outs < 3) {
      save();
    }
  } else {
    state.strikes++;
    save();
  }
}

function playBall() {
pushHistory();

addPitchCount(1);
  const side = getBattingSide();

  if (state.balls >= 3) {
    resetBSOnly();
    advanceBatter(side);

    const first = !!state.bases.first;
    const second = !!state.bases.second;
    const third = !!state.bases.third;

    if (first && second && third) {
      addRuns(1);
    }

    if (first && second) {
      state.bases.third = true;
    }

    if (first) {
      state.bases.second = true;
    }

    state.bases.first = true;

    save();
  } else {
    state.balls++;
    save();
  }
}

function playHit() {

addPitchCount(1);

  // 三塁ランナーがいた場合のみ1点追加

  // ランナーをひとつずつ進める
  state.bases.third = second;
  state.bases.second = first;
  state.bases.first = true;

  // カウントリセット、打者を次へ
  recordBatterStat(side,{atBat:1,hit:1});
  resetBSOnly();
  advanceBatter(side);

  save();
}

function deepCloneForBenchSwap(v) {
  return v == null ? v : JSON.parse(JSON.stringify(v));
}

async function swapBenches() {
  pushHistory();

  // visitor/home は物理的な左右ベンチを表す。
  // チームそのものの試合内容を維持したまま、左右だけを丸ごと交換する。
  const oldVisitorScore = state.visitorScore;
  state.visitorScore = state.homeScore;
  state.homeScore = oldVisitorScore;

  const oldVisitorName = state.visitorName;
  state.visitorName = state.homeName;
  state.homeName = oldVisitorName;

  const swapSideObject = key => {
    if (!state[key] || typeof state[key] !== "object") return;
    const oldVisitor = deepCloneForBenchSwap(state[key].visitor);
    state[key].visitor = deepCloneForBenchSwap(state[key].home);
    state[key].home = oldVisitor;
  };

  // 左右のチームに紐づく全データ
  ["orders", "currentBatter", "pitchCounts", "teamInfo", "playerMasters"].forEach(swapSideObject);

  // ランニングスコアは配列と表示名をまとめて交換
  if (state.running && typeof state.running === "object") {
    const rv = deepCloneForBenchSwap(state.running.visitor);
    state.running.visitor = deepCloneForBenchSwap(state.running.home);
    state.running.home = rv;

    const rn = state.running.visitorName;
    state.running.visitorName = state.running.homeName;
    state.running.homeName = rn;
  }

  // 同じチームが先攻/後攻のままであるよう、ベンチ側の反転に合わせる。
  state.firstBatSide = state.firstBatSide === "home" ? "visitor" : "home";

  // 左右を直接保持している一時表示は誤表示防止のため閉じる。
  state.showOrderSide = "";
  if (state.playerImage) {
    state.playerImage = { ...state.playerImage, show:false, side:"", name:"", filename:"", url:"" };
  }

  // まずスコアボード本体を保存・描画。
  save();

  // ビジョン側に保持している左右別素材も同時交換。
  // ここを交換しないと、ベンチ入替直後だけ旧チームの写真/ロゴが出る。
  try {
    const snap = await VISION_REF.once("value");
    const v = snap.val() || {};
    const updates = {};

    if (v.assets && typeof v.assets === "object") {
      updates["assets/visitor"] = deepCloneForBenchSwap(v.assets.home || {});
      updates["assets/home"] = deepCloneForBenchSwap(v.assets.visitor || {});
    }

    const logos = v.teamLogo || v.teamLogos;
    if (logos && typeof logos === "object") {
      updates["teamLogo/visitor"] = deepCloneForBenchSwap(logos.home || null);
      updates["teamLogo/home"] = deepCloneForBenchSwap(logos.visitor || null);
    }

    // スタメン発表中の古いsnapshotは左右交換後の状態と不整合になるため待機へ戻す。
    if ((v.mode || "") === "STARTER") {
      updates["starter/active"] = false;
      updates["starter/phase"] = "idle";
      updates["starter/step"] = -1;
      updates["starter/side"] = "";
      updates["starter/index"] = -1;
      updates["starter/requestId"] = Date.now();
    }

    if (Object.keys(updates).length) await VISION_REF.update(updates);
  } catch (e) {
    console.warn("ビジョン左右素材のベンチ入替に失敗:", e);
    // scoreboard/state の入替自体は完了しているため、操作を巻き戻さない。
  }

  // 左右別素材を現在のオーダーから再同期して最終整合を取る。
  try {
    await Promise.all([
      syncVisionAssetsForSide("visitor"),
      syncVisionAssetsForSide("home")
    ]);
  } catch (e) {
    console.warn("ベンチ入替後の素材再同期に失敗:", e);
  }
}

async function resolveIndividualTelopUrl(side, name) {
  const info = state.teamInfo?.[side] || {};
  const teamFolder = String(info.storageFolder || info.folder || info.fullName || info.name || "").trim();
  if (!teamFolder) throw new Error("チームのStorageフォルダ名が登録されていません");
  const wanted = `${String(name || "").trim()}.png`;
  const basePath = `vision/players/${teamFolder}/個別テロップ`;
  try { return await FIREBASE_STORAGE.ref(`${basePath}/${wanted}`).getDownloadURL(); } catch (e) {}
  const normalize = v => String(v || "").normalize("NFKC").replace(/[\s　]+/g, "").toLowerCase();
  const list = await FIREBASE_STORAGE.ref(basePath).listAll();
  const target = normalize(wanted);
  const found = list.items.find(item => normalize(item.name) === target);
  if (!found) throw new Error(`個別テロップが見つかりません：${basePath}/${wanted}`);
  return await found.getDownloadURL();
}

// ===== 低遅延メディアキャッシュ =====
const mediaUrlCache=new Map();
const mediaFolderCache=new Map();
let mediaPrewarmTimer=null;

async function cachedStorageUrl(path){
  const clean=String(path||"").trim();
  if(!clean)throw new Error("ファイル名が指定されていません");
  if(mediaUrlCache.has(clean))return mediaUrlCache.get(clean);
  const promise=FIREBASE_STORAGE.ref(clean).getDownloadURL().catch(e=>{mediaUrlCache.delete(clean);throw e});
  mediaUrlCache.set(clean,promise);
  return promise;
}
async function cachedFolderItems(path){
  const clean=String(path||"").trim();
  if(mediaFolderCache.has(clean))return mediaFolderCache.get(clean);
  const promise=FIREBASE_STORAGE.ref(clean).listAll().then(r=>r.items).catch(e=>{mediaFolderCache.delete(clean);throw e});
  mediaFolderCache.set(clean,promise);
  return promise;
}
function stripMediaExt(name){return String(name||"").replace(/\.[^.]+$/,"").trim()}

/* 選手名のメディア照合専用。
   表示名やStorage上のファイル名は変更せず、比較時だけ
   Unicode表記差・全角/半角スペース・改行等の空白差を吸収する。 */
function normalizeMediaPlayerName(name){
  return stripMediaExt(name)
    .normalize("NFKC")
    .replace(/[\s\u3000\u00A0\u200B-\u200D\uFEFF]+/g,"")
    .trim();
}

async function resolveExactMedia(folder,playerName,regex){
  const items=await cachedFolderItems(folder);
  const target=normalizeMediaPlayerName(playerName);
  const item=items.find(ref=>
    regex.test(ref.name) &&
    normalizeMediaPlayerName(ref.name)===target
  );
  if(!item)return null;
  const url=await cachedStorageUrl(item.fullPath);
  return {item,url,filename:item.name,storagePath:item.fullPath};
}
async function prewarmControlMedia(){
  const jobs=[];
  // 固定イベント動画は起動直後にURLを解決。
  jobs.push((async()=>{
    const items=await cachedFolderItems("vision/videos");
    const wanted=["ナイスピッチング","ナイスバッティング","ナイスラン","ナイスプレイ","ホームラン","ファールボール"];
    // 固定演出のURLを起動時に解決し、ボタン押下時のStorage検索を省略する。
    await Promise.allSettled(wanted.map(async name=>{
      const normalize=value=>String(value||"").normalize("NFKC").trim();
      const base=normalize(name);
      const extensions=name==="ファールボール"?["mov"]:["mp4","mov"];
      let item=null;
      for(const ext of extensions){
        item=items.find(x=>normalize(x.name)===normalize(`${name}.${ext}`))
          ||items.find(x=>normalize(x.name).includes(base)&&x.name.toLowerCase().endsWith(`.${ext}`));
        if(item)break;
      }
      if(item)await cachedStorageUrl(item.fullPath);
    }));
  })());
  // 現在の両チームオーダーは操作前に一覧とURLを解決。
  for(const side of ["visitor","home"]){
    const info=state.teamInfo?.[side]||{};
    const folder=String(info.storageFolder||info.folder||info.fullName||info.name||"").trim();
    if(!folder)continue;
    const graphics=`vision/graphics/${folder}`;
    const batMusic=`vision/music/${folder}/打者`;
    const pitMusic=`vision/music/${folder}/投手`;
    jobs.push(cachedFolderItems(graphics),cachedFolderItems(batMusic),cachedFolderItems(pitMusic));
    for(const p of state.orders?.[side]||[]){
      if(!p?.name)continue;
      jobs.push(resolveExactMedia(graphics,p.name,/\.(png|jpe?g|webp|gif|mp4|mov|webm|m4v)$/i).catch(()=>null));
      const mf=String(p.order||"").toUpperCase()==="P"?pitMusic:batMusic;
      jobs.push(resolveExactMedia(mf,p.name,/\.(mp3|m4a|aac|wav|ogg|oga|webm)$/i).catch(()=>null));
    }
  }
  await Promise.allSettled(jobs);
}
let lastMediaPrewarmKey="";
function scheduleMediaPrewarm(){
  const key=JSON.stringify({teamInfo:state.teamInfo,orders:state.orders});
  if(key===lastMediaPrewarmKey)return;
  lastMediaPrewarmKey=key;
  clearTimeout(mediaPrewarmTimer);
  mediaPrewarmTimer=setTimeout(()=>prewarmControlMedia().catch(e=>console.warn("メディア先読み失敗",e)),150);
}
async function getFirebaseStorageUrl(filename) {
  const cleanFilename=String(filename||"").trim();
  if(!cleanFilename)throw new Error("ファイル名が指定されていません");
  try{return await cachedStorageUrl(cleanFilename)}
  catch(error){
    console.error("Firebase Storage URL取得エラー",{filename:cleanFilename,error});
    throw new Error(`Firebase Storageにファイルが見つかりません：${cleanFilename}`);
  }
}

async function playPlayerVideo(
  side,
  index,
  event
) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  // クリックした瞬間に視覚フィードバック（素材解決・通信待ち不要）。
  if(event?.currentTarget){event.currentTarget.classList.add("mediaPending");}

  /*
   動画再生中に「動画」ボタンを押した場合は再生停止。
   PLAYER_VIDEO_REF を削除すると、ビジョン側も即座に動画を閉じる。
  */
  // 停止判定はローカル状態ではなくFirebaseを正とする。
  // 再生指示が存在する状態で動画ボタンを押したら、必ず削除＝停止。
  // Firebase購読で常時同期しているローカル状態を使い、押下時のonce()往復を省く。
  if(state.videoPlayback?.show && state.videoPlayback?.requestId){
    state.videoPlayback={show:false,side:"",name:"",filename:"",storagePath:"",url:"",requestId:0};
    render();
    await PLAYER_VIDEO_REF.remove();
    return;
  }

  const player =
    state.orders?.[side]?.[index];

  if (
    !player ||
    !player.name
  ) {
    alert(
      "選手名が登録されていません"
    );

    return;
  }

  const playerName =
    String(player.name).trim();

  // 選手の「動画」ボタンは、その選手が所属する現在のチーム名のgraphicsフォルダを参照する。
  // 例: vision/graphics/富合クラブ/選手名.ext / vision/graphics/宇城パイレーツ/選手名.ext
  // storageFolder が設定されている場合はそれを優先し、なければチーム正式名をフォルダ名として使う。
  const teamInfo = state.teamInfo?.[side] || {};
  const teamFolder = String(
    teamInfo.storageFolder ||
    teamInfo.folder ||
    teamInfo.fullName ||
    teamInfo.name ||
    ""
  ).trim();

  if (!teamFolder) {
    alert("チーム名が登録されていません");
    return;
  }

  const graphicsFolder = `vision/graphics/${teamFolder}`;
  const requestId = Date.now();

  try {
    const resolved=await resolveExactMedia(graphicsFolder,playerName,/\.(png|jpe?g|webp|gif|mp4|mov|webm|m4v)$/i);
    if(!resolved)throw new Error(`${graphicsFolder}/ 内に「${playerName}」と一致する画像・動画が見つかりません`);
    const {filename,storagePath,url}=resolved;
    const isImage = /\.(png|jpe?g|webp|gif)$/i.test(filename);

    const playback = {
      show: true,
      side,
      name: playerName,
      filename,
      storagePath,
      url,
      mediaType: isImage ? "image" : "video",
      requestId,
      loop: false,
      // 選手の動画／画像は自動終了しない。もう一度「動画」ボタンを押した時だけ終了する。
      holdLastFrame: true
    };

    /*
     操作画面のボタン表示用
    */
    state.videoPlayback =
      playback;

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

    render();

    /*
     Storageの再生URLを含めて
     Realtime Databaseへ送信
    */
    await PLAYER_VIDEO_REF.set(
      playback
    );

  } catch (error) {
    console.error(
      "動画再生指示の送信に失敗しました",
      error
    );

    state.videoPlayback = {
      show: false,
      side: "",
      name: "",
      filename: "",
      storagePath: "",
      url: "",
      requestId: 0
    };

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

    render();

    alert(
      error?.message ||
       "動画をFirebase Storageから取得できませんでした"

    );

  }

}

    // MP4が無い場合のみ従来のMOVをフォールバックとして使用する。
    const base = normalizeName(baseName);
    const findExact = ext => {
      const wanted = normalizeName(`${baseName}.${ext}`);
      return result.items.find(ref => normalizeName(ref.name) === wanted);
    };
    const findContains = ext => result.items.find(ref => {
      const n = normalizeName(ref.name);
      return n.includes(base) && n.toLowerCase().endsWith(`.${ext}`);
    });
    let item = findExact("mp4") || findContains("mp4") || findExact("mov") || findContains("mov");
    if (!item) throw new Error(`vision/videos 内に「${baseName}」のMP4/MOV動画が見つかりません`);
    await playEventVideo(item.fullPath, baseName, 0, false, true);
  } catch (error) {
    console.error(`${baseName}動画の検索に失敗しました`, error);
    alert(error?.message || `${baseName}動画を取得できませんでした`);
  }
}

async function playFoulVideo() {
  try {
    // Storage上の実ファイル名を取得してから再生する。
    // 日本語ファイル名のUnicode差・前後空白などがあっても一致できるようにする。
    const result = {items:await cachedFolderItems("vision/videos")};

    const normalizeName = value =>
      String(value || "").normalize("NFKC").trim();

    const wanted = normalizeName("ファールボール.mov");
    let item = result.items.find(ref => normalizeName(ref.name) === wanted);

    // 完全一致しない場合は「ファールボール」を含むmovを探す。
    if (!item) {
      item = result.items.find(ref => {
        const n = normalizeName(ref.name);
        return n.includes("ファールボール") && n.toLowerCase().endsWith(".mov");
      });
    }

    if (!item) {
      throw new Error("vision/videos 内にファールボール動画が見つかりません");
    }

    await playEventVideo(
      item.fullPath,
      "ファールボール",
      8000
    );
  } catch (error) {
    console.error("ファールボール動画の検索に失敗しました", error);
    alert(error?.message || "ファールボール動画を取得できませんでした");
  }
}

async function playEventVideo(
  filename,
  name,
  autoStopMs = 0,
  loop = false,
  holdLastFrame = false
) {
  const cleanFilename =
    String(filename || "").trim();

  if (!cleanFilename) {
    return;
  }

  const requestId =
    Date.now();

  try {
    const url =
      await getFirebaseStorageUrl(
        cleanFilename
      );

    const playback = {
      show: true,
      side: "event",
      name: String(name || ""),
      filename: cleanFilename,
      storagePath: cleanFilename,
      url,
      requestId,
      loop: !!loop,
      holdLastFrame: !!holdLastFrame
    };

    state.videoPlayback =
      playback;

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

    render();

    await PLAYER_VIDEO_REF.set(
      playback
    );

    // 指定されたイベント動画だけ自動停止する。
    // requestId を確認するため、途中で別の動画に切り替わった場合は止めない。
    if (autoStopMs > 0) {
      setTimeout(async () => {
        try {
          const snapshot = await PLAYER_VIDEO_REF.once("value");
          const current = snapshot.val();
          if (current && current.requestId === requestId) {
            await PLAYER_VIDEO_REF.remove();
          }
        } catch (error) {
          console.error("イベント動画の自動停止に失敗しました", error);
        }
      }, autoStopMs);
    }

  } catch (error) {
    console.error(
      "イベント動画の取得に失敗しました",
      error
    );

    alert(
      error?.message ||
      "イベント動画をFirebase Storageから取得できませんでした"
    );
  }
}

function playSacBunt() {
if (Number(state.outs || 0) >= 2) return;
  if (!hasRunner()) return;

  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  if (state.bases.third) addRuns(1);

  const first = !!state.bases.first;
  const second = !!state.bases.second;

  state.bases.third = second;
  state.bases.second = first;
  state.bases.first = false;

  resetBSOnly();
  advanceBatter(side);
  addOut();

  if (state.outs < 3) save();
}

function playSacFly() {
if (Number(state.outs || 0) >= 2) return;
  if (!state.bases.third) return;

  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  addRuns(1);
  state.bases.third = false;

  resetBSOnly();
  advanceBatter(side);
  addOut();

  if (state.outs < 3) save();
}

function playSteal() {
  pushHistory();

  if (state.bases.third) {
    addRuns(1);
    state.bases.third = false;
  }

  if (state.bases.second) {
    state.bases.third = true;
    state.bases.second = false;
  }

  if (state.bases.first) {
    state.bases.second = true;
    state.bases.first = false;
  }

  save();
}

function playDouble() {
  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  if (state.bases.third) addRuns(1);
  if (state.bases.second) addRuns(1);

  const first = !!state.bases.first;

  state.bases.third = first;
  state.bases.second = true;
  state.bases.first = false;

  recordBatterStat(side,{atBat:1,hit:1});
  resetBSOnly();
  advanceBatter(side);
  save();
}

function playTriple() {
  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  let runs = 0;
  if (state.bases.first) runs++;
  if (state.bases.second) runs++;
  if (state.bases.third) runs++;

  if (runs > 0) addRuns(runs);

  state.bases.first = false;
  state.bases.second = false;
  state.bases.third = true;

  recordBatterStat(side,{atBat:1,hit:1});
  resetBSOnly();
  advanceBatter(side);
  save();
}

function playDoublePlay() {
  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  const first = !!state.bases.first;
  const second = !!state.bases.second;
  const third = !!state.bases.third;

  recordBatterStat(side,{atBat:1});
  resetBSOnly();
  advanceBatter(side);

  // ランナーが1人だけの場合
  // そのランナーと打者走者がアウト
  if (
    (first && !second && !third) ||
    (!first && second && !third) ||
    (!first && !second && third)
  ) {
    state.bases = {
      first: false,
      second: false,
      third: false
    };
  }

  // 一・二塁
  else if (first && second && !third) {
    // 二塁走者は三塁へ残り、
    // 一塁走者と打者走者がアウト
    state.bases = {
      first: false,
      second: false,
      third: true
    };
  }

  // 一・三塁
  else if (first && !second && third) {
    // 三塁走者は残り、
    // 一塁走者と打者走者がアウト
    state.bases = {
      first: false,
      second: false,
      third: true
    };
  }

  // 二・三塁
  else if (!first && second && third) {
    // 三塁走者と打者走者がアウト、
    // 二塁走者は二塁に残る
    state.bases = {
      first: false,
      second: true,
      third: false
    };
  }

  // 満塁
  else if (first && second && third) {
    // 三塁走者と打者走者がアウト、
    // 一・二塁走者はそのまま残る
    state.bases = {
      first: true,
      second: true,
      third: false
    };
  }

  // ランナーなしの場合
  else {
    state.bases = {
      first: false,
      second: false,
      third: false
    };
  }

  state.outs = Number(state.outs || 0) + 2;

  if (state.outs >= 3) {
    endHalfInning(false);
  } else {
    save();
  }
}

function playErrorReach() {
  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  const first = !!state.bases.first;
  const second = !!state.bases.second;
  const third = !!state.bases.third;

  if (third) {
    addRuns(1);
  }

  state.bases.third = second;
  state.bases.second = first;
  state.bases.first = true;

  recordBatterStat(side,{atBat:1});
  resetBSOnly();
  advanceBatter(side);

  save();
}

async function warmBulkPreviewSide(side){
  if(!side)return;
  if(bulkPreviewWarmPromise[side])return bulkPreviewWarmPromise[side];
  bulkPreviewWarmPromise[side]=(async()=>{
    await loadVisionAssetCatalog(side);
    const team=visionTeamName(side);
    const teamFolder=visionStorageCatalog[side]?.teamFolder||team;
    const masters=(state.playerMasters?.[side]||[]).filter(m=>String(m?.name||"").trim());

    // モーダルを開いている間に全登録選手の「名前画像URL」だけ先に解決する。
    // シート紹介では写真・ポジション画像は使わないため、ここでは取得しない。
    await Promise.all(masters.map(async master=>{
      const item={number:master.number||"",name:master.name||"",position:""};
      const key=bulkPreviewAssetKey(item);
      if(bulkPreviewAssetCache[side].has(key))return;
      const nameFile=master.nameFile||visionSuggestFile(master.name,visionStorageCatalog[side]?.names||[],"name");
      const nameUrl=nameFile?await visionDownloadUrl(`vision/players/${teamFolder}/names/${nameFile}`):"";
      const asset={
        team,teamFolder,name:master.name||"",number:master.number||"",
        nameImage:nameUrl?{url:nameUrl,filename:nameFile,storagePath:`vision/players/${teamFolder}/names/${nameFile}`} : null
      };
      bulkPreviewAssetCache[side].set(key,asset);
      // ブラウザキャッシュにも画像本体を先読みする。
      if(nameUrl){
        const img=new Image();
        img.decoding="async";
        img.src=nameUrl;
      }
    }));
  })().finally(()=>{bulkPreviewWarmPromise[side]=null;});
  return bulkPreviewWarmPromise[side];
}

async function buildBulkPreviewAssets(side,previewOrders){
  // モーダル表示時の先読みがまだ終わっていれば待つ。通常は既に完了済み。
  if(bulkPreviewWarmPromise[side])await bulkPreviewWarmPromise[side];

  const team=visionTeamName(side);
  const teamFolder=visionStorageCatalog[side]?.teamFolder||team;
  const masters=state.playerMasters?.[side]||[];
  const out={};

  // キャッシュに無い選手だけを追加取得。全選手を毎回Storageへ問い合わせない。
  const missing=[];
  for(const item of previewOrders){
    if(!item?.name||!item?.order)continue;
    const baseKey=`${String(item?.number||"")}::${String(item?.name||"").trim()}::`;
    let asset=bulkPreviewAssetCache[side].get(baseKey);
    if(!asset)missing.push(item);
  }

  if(missing.length){
    await loadVisionAssetCatalog(side);
    await Promise.all(missing.map(async item=>{
      const master=masters.find(m=>
        (item.number&&String(m.number||"")===String(item.number))||
        String(m.name||"").trim()===String(item.name||"").trim()
      )||{};
      const nameFile=master.nameFile||visionSuggestFile(item.name,visionStorageCatalog[side]?.names||[],"name");
      const nameUrl=nameFile?await visionDownloadUrl(`vision/players/${teamFolder}/names/${nameFile}`):"";
      const baseKey=`${String(item?.number||"")}::${String(item?.name||"").trim()}::`;
      bulkPreviewAssetCache[side].set(baseKey,{
        team,teamFolder,name:item.name,number:item.number||"",
        nameImage:nameUrl?{url:nameUrl,filename:nameFile,storagePath:`vision/players/${teamFolder}/names/${nameFile}`} : null
      });
      if(nameUrl){const img=new Image();img.decoding="async";img.src=nameUrl;}
    }));
  }

  for(const item of previewOrders){
    if(!item?.name||!item?.order)continue;
    const baseKey=`${String(item?.number||"")}::${String(item?.name||"").trim()}::`;
    const base=bulkPreviewAssetCache[side].get(baseKey)||{};
    const asset={...base,order:item.order||"",positionCode:item.position||""};
    out[`order:${String(item.order)}`]=asset;
    if(item.number)out[String(item.number)]=asset;
    if(item.name)out[String(item.name).trim()]=asset;
  }
  return out;
}

function commitBulkPreviewInBackground(side,previewOrders){
  const committedOrders=previewOrders.map(p=>({order:p.order,position:p.position,number:p.number,name:p.name}));
  state.orders[side]=JSON.parse(JSON.stringify(committedOrders));
  save();
  bulkPreviewCommitted=true;
  bulkPreviewCommitPromise=(async()=>{
    try{ await syncVisionAssetsForSide(side); }
    catch(e){ console.error("シート表示中の選手素材先行同期に失敗しました",e); }
  })();
  return bulkPreviewCommitPromise;
}

async function showBulkSheetPreview(){
  if(!bulkEditSide)return;

  // 押した瞬間に操作盤へフィードバック。通信完了を待ってから色を変えない。
  setBulkPreviewUi("loading");

  const side=bulkEditSide;
  const previewOrders=getBulkModalOrders();
  const previousOrders=JSON.parse(JSON.stringify(state?.orders?.[side]||[]));

  // 打順ごとに「直前の実オーダー」と比較。選手名または守備位置が違う行を変更扱いにする。
  const changedOrders={};
  previewOrders.forEach((p,index)=>{
    const before=previousOrders[index]||{};
    const changed=
      String(p?.name||"").trim()!==String(before?.name||"").trim() ||
      String(p?.position||"").trim()!==String(before?.position||"").trim();
    if(changed)changedOrders[String(p?.order||ORDER_LABELS[index])]=true;
  });

  const teamInfo=JSON.parse(JSON.stringify(state?.teamInfo?.[side]||{}));
  const folder=String(teamInfo.storageFolder||teamInfo.folder||teamInfo.fullName||teamInfo.name||"").trim();
  if(!folder){alert("選択チームのStorageフォルダ名が登録されていません。");return;}

  const first=state?.firstBatSide==="home"?"home":"visitor";
  const batting=side===first?"first":"second";
  const bench=side==="home"?"1塁側":"3塁側";

  try{
    // 正式保存前なので visionState.assets は旧オーダーのまま。
    // モーダルで現在選択中の選手からプレビュー専用素材をその場で作る。
    const previewAssets=await buildBulkPreviewAssets(side,previewOrders);

    await VISION_REF.update({
      mode:"SHEET_INTRO",
      sheetIntro:{
        active:true,
        side,
        batting,
        bench,
        preview:true,
        highlightChanges:true,
        changedOrders,
        backgroundFile:`シート紹介背景${bench}.png`,
        teamFolder:folder,
        orders:previewOrders,
        assets:previewAssets,
        requestId:Date.now()

      "starter/active":false

    commitBulkPreviewInBackground(side,previewOrders);
  }catch(e){
    setBulkPreviewUi("idle");
    console.error("一括交代シートプレビュー表示失敗",e);
    alert("シート表示に失敗しました。");
  }
}

function ensurePlayerMasters() {
  if (!state.playerMasters) {
    state.playerMasters = {
      visitor: [],
      home: []
    };
  }

  ["visitor", "home"].forEach(side => {
    if (!Array.isArray(state.playerMasters[side])) {
      state.playerMasters[side] = [];
    }
    state.playerMasters[side].forEach(player=>{
      player.atBats=Math.max(0,Number(player.atBats||0)||0);
      player.hits=Math.max(0,Number(player.hits||0)||0);
      player.homeRuns=Math.max(0,Number(player.homeRuns||0)||0);
    });
  });
}

function makePlayerSelectHtml(side, index, currentName, currentNumber = "") {
  ensurePlayerMasters();

  const sortedPlayers =
    [...state.playerMasters[side]]
      .filter(player => player.name && player.name.trim() !== "")
      .sort((a, b) => {
        const an = Number(a.number);
        const bn = Number(b.number);

        if (!isNaN(an) && !isNaN(bn)) return an - bn;
        if (!isNaN(an)) return -1;
        if (!isNaN(bn)) return 1;

        return String(a.number || "").localeCompare(String(b.number || ""), "ja");
      });

  let html = `
    <select class="bulkSelect" id="bulk_name_${index}">
      <option value="">選択してください</option>
  `;

  sortedPlayers.forEach(player => {
    const name = player.name || "";
    const number = player.number || "";
    const selected =
      number === currentNumber || name === currentName ? "selected" : "";

    html += `
      <option value="${number}" data-name="${name}" ${selected}>
        ${number ? number + "　" : ""}${name}
      </option>
    `;
  });

  html += `</select>`;
  return html;
}
function visionTeamName(side){
  return String(state.teamInfo?.[side]?.fullName || "").trim();
}
function visionNormalizeName(v){
  return String(v||"").replace(/[\s・･.．]/g,"").toLowerCase();
}
function visionFileBase(v){
  return String(v||"").replace(/\.[^.]+$/,"");
}
function visionSuggestFile(playerName, files, kind){
  const n=visionNormalizeName(playerName);
  if(!n) return "";
  let best="",score=-1;
  for(const f of files||[]){
    const b=visionNormalizeName(visionFileBase(f));
    let sc=-1;
    if(b===n) sc=100;
    else if(n.includes(b) || b.includes(n)) sc=kind==="name"?80:70;
    else {
      const parts=String(playerName||"").split(/[\s　・･]+/).filter(Boolean).map(visionNormalizeName);
      if(parts.some(x=>x && (b===x || b.includes(x) || x.includes(b)))) sc=60;
    }
    if(sc>score){score=sc;best=f;}
  }
  return score>=60?best:"";
}
function visionAssetOptions(files,current,suggested){
  const chosen=current||suggested||"";
  let h='<option value="">未設定</option>';
  for(const f of files||[]){
    const esc=String(f).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    h+=`<option value="${esc}" ${f===chosen?'selected':''}>${esc}</option>`;
  }
  return h;
}
async function resolveVisionTeamFolder(side){
  const team=visionTeamName(side);
  if(!team) return "";
  try{
    const root=await FIREBASE_STORAGE.ref("vision/players").listAll();
    const folders=root.prefixes.map(x=>x.name);
    if(!folders.length) return team;
    if(folders.includes(team)) return team;
    const n=visionNormalizeName(team);
    let hit=folders.find(f=>{
      const fn=visionNormalizeName(f);
      return fn===n || fn.includes(n) || n.includes(fn);
    });
    if(hit) return hit;
    const shortName=String(state.teamInfo?.[side]?.shortName||"").trim();
    if(shortName){
      const sn=visionNormalizeName(shortName);
      hit=folders.find(f=>visionNormalizeName(f).includes(sn));
      if(hit) return hit;
    }
    console.warn("該当するStorageチームフォルダが見つかりません",team,folders);
    return team;
  }catch(e){
    console.warn("チームフォルダ一覧取得失敗",e);
    return team;
  }
}
async function loadVisionAssetCatalog(side){
  const team=visionTeamName(side);
  if(!team){ visionStorageCatalog[side]={photos:[],names:[],teamFolder:""}; return; }
  const teamFolder=await resolveVisionTeamFolder(side);
  async function list(path){
    try{
      const r=await FIREBASE_STORAGE.ref(path).listAll();
      return r.items.map(x=>x.name).sort((a,b)=>a.localeCompare(b,'ja'));
    }catch(e){ console.warn('素材一覧取得失敗',path,e); return []; }
  }
  const [photos,names]=await Promise.all([
    list(`vision/players/${teamFolder}/photos`),
    list(`vision/players/${teamFolder}/names`)
  ]);
  visionStorageCatalog[side]={photos,names,teamFolder};
}
async function visionDownloadUrl(path){
  try{return await FIREBASE_STORAGE.ref(path).getDownloadURL();}catch(e){console.warn('素材URL取得失敗',path,e);return "";}
}
async function syncVisionAssetsForSide(side){
  const team=visionTeamName(side);
  if(!team) return;
  await loadVisionAssetCatalog(side);
  const teamFolder=visionStorageCatalog[side]?.teamFolder || team;
  const masters=state.playerMasters?.[side]||[];
  const orders=state.orders?.[side]||[];
  const out={};
  for(const item of orders){
    if(!item?.name) continue;
    const master=masters.find(m=>(item.number && String(m.number)===String(item.number)) || m.name===item.name) || {};
    const photoFile=master.photoFile || visionSuggestFile(item.name,visionStorageCatalog[side].photos,'photo');
    const nameFile=master.nameFile || visionSuggestFile(item.name,visionStorageCatalog[side].names,'name');
    const [playerUrl,nameUrl,posUrl]=await Promise.all([
      photoFile?visionDownloadUrl(`vision/players/${teamFolder}/photos/${photoFile}`):Promise.resolve(""),
      nameFile?visionDownloadUrl(`vision/players/${teamFolder}/names/${nameFile}`):Promise.resolve(""),
      item.position?visionDownloadUrl(`vision/positions/${item.position}.png`):Promise.resolve("")
    ]);
    // ビジョン表示は「打順」を基準に素材を引く。
    // 背番号をキーにすると、背番号と別選手の打順番号が同じ場合に誤画像を拾うため、
    // 必ず order:1 ～ order:9 / order:P の専用キーで保存する。
    const key=`order:${String(item.order||"")}`;
    if(!item.order) continue;
    out[key]={
      team,name:item.name,number:item.number||"",order:item.order||"",positionCode:item.position||"",
      player:playerUrl?{url:playerUrl,filename:photoFile,storagePath:`vision/players/${teamFolder}/photos/${photoFile}`} : null,
      nameImage:nameUrl?{url:nameUrl,filename:nameFile,storagePath:`vision/players/${teamFolder}/names/${nameFile}`} : null,
      position:posUrl?{url:posUrl,filename:`${item.position}.png`,storagePath:`vision/positions/${item.position}.png`} : null
    };
  }
  await VISION_REF.child(`assets/${side}`).set(out);
}

function buildStarterSequence(firstSide){
  const secondSide=firstSide==="visitor"?"home":"visitor";
  const seq=[];
  const snapOrders=visionState?.starter?.snapshot?.orders||state?.orders||{};
  for(const side of [firstSide,secondSide]){
    seq.push({phase:"logo",side,index:-1});
    const orders=(snapOrders?.[side]||[]).slice(0,10);
    orders.forEach((p,index)=>{
      if(p && (String(p.name||"").trim() || String(p.number||"").trim())){
        // 1選手につき「紹介素材」→「オーダー反映＋中央写真」の2段階
        seq.push({phase:"media",side,index});
        seq.push({phase:"player",side,index});
      }
    });
  }
  return seq;
}
async function ensureStarterTeamLogos(){
  const result={};
  for(const side of ["visitor","home"]){
    const file=String(state.teamInfo?.[side]?.teamLogoFile||"").trim();
    if(!file)continue;
    try{
      result[side]={url:await FIREBASE_STORAGE.ref(`vision/team-logos/${file}`).getDownloadURL(),filename:file};

  });

function playDeadBall() {
  pushHistory();
  addPitchCount(1);

  const side = getBattingSide();

  const first = !!state.bases.first;
  const second = !!state.bases.second;
  const third = !!state.bases.third;

  if (first && second && third) {
    addRuns(1);
  }

  if (first && second) {
    state.bases.third = true;
  }

  if (first) {
    state.bases.second = true;
  }

  state.bases.first = true;

  resetBSOnly();
  advanceBatter(side);

  save();
}

function playTagUp() {
if (Number(state.outs || 0) >= 2) return;
  if (!hasRunner()) return;

  pushHistory();
  addPitchCount(1);

  if (state.bases.third) {
    addRuns(1);
    state.bases.third = false;
  }

  if (state.bases.second) {
    state.bases.third = true;
    state.bases.second = false;
  }

  if (state.bases.first) {
    state.bases.second = true;
    state.bases.first = false;
  }

  recordBatterStat(getBattingSide(),{atBat:1});
  resetBSOnly();

  // タッチアップは打者の打席結果（フライアウト）を伴うため、打順も次へ進める
  advanceBatter(getBattingSide());
  addOut();

  if (state.outs < 3) {
    save();
  }
}

function hasRunner() {
  return !!(
    state.bases.first ||
    state.bases.second ||
    state.bases.third
  );
}

// チームマスタの正本はFirebase。
// 起動時に古いlocalStorageを読み込むと、修正前の選手名が一時的に復活するため先読みしない。
// Firebase受信後のみローカルキャッシュへ反映する。
let teamMastersCache = {};

function loadTeamMasters() {
  return teamMastersCache || {};
}

function teamMasterFirebaseKey(fullName) {
  const bytes = new TextEncoder().encode(String(fullName || ""));
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

async function saveTeamMaster(teamInfo, players) {
  const fullName = String(teamInfo?.fullName || "").trim();
  if (!fullName) return;

  const master = {
    teamInfo: {
      fullName,
      shortName: String(teamInfo?.shortName || "").trim(),
      teamLogoFile: String(teamInfo?.teamLogoFile || "").trim()
    },
    players: JSON.parse(JSON.stringify(players || [])),
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  };

  // 画面表示用キャッシュにも即時反映
  teamMastersCache[fullName] = {
    teamInfo: master.teamInfo,
    players: JSON.parse(JSON.stringify(master.players))
  };
  localStorage.setItem(TEAM_MASTER_KEY, JSON.stringify(teamMastersCache));

  // 正本は Firebase Realtime Database に保存
  await TEAM_MASTERS_REF.child(teamMasterFirebaseKey(fullName)).set(master);
}

function applyTeamMasterByName(side, teamName) {
  const name = String(teamName || "").trim();
  if (!name) return false;

  const master = loadTeamMasters()[name];
  if (!master) return false;

  state.teamInfo[side] = {
    fullName: master.teamInfo?.fullName || name,
    shortName: master.teamInfo?.shortName || "",
    teamLogoFile: master.teamInfo?.teamLogoFile || ""
  };
  state.playerMasters[side] = JSON.parse(JSON.stringify(master.players || []));
  return true;
}

async function deleteSelectedTeamMaster() {
  const select = document.getElementById("saved_team_select");
  const selectedName = String(select?.value || "").trim();
  const assetTeamName = String((visionStorageCatalog[masterEditSide] || {}).teamFolder || "").trim();
  const inputName = String(document.getElementById("team_full_name")?.value || "").trim();

  // 優先順位：保存済みで明示選択 → 現在読み込み中のマスタ → Storage上の現在チーム → 入力中のチーム名
  let teamName = selectedName || masterLoadedTeamName;
  if (!teamName && assetTeamName && teamMastersCache[assetTeamName]) teamName = assetTeamName;
  if (!teamName && inputName && teamMastersCache[inputName]) teamName = inputName;

  if (!teamName || !teamMastersCache[teamName]) {
    alert("現在表示しているチームに対応する保存済みマスタが見つかりません。");
    return;
  }

  if (!confirm(`「${teamName}」をチームマスタから削除しますか？
この操作は元に戻せません。`)) return;

  try {
    await TEAM_MASTERS_REF.child(teamMasterFirebaseKey(teamName)).remove();
    delete teamMastersCache[teamName];
    localStorage.setItem(TEAM_MASTER_KEY, JSON.stringify(teamMastersCache));
    if (masterLoadedTeamName === teamName) masterLoadedTeamName = "";

    // 現在の先攻・後攻の試合設定は消さず、保存済みマスタだけ削除する
    renderMasterRows();
    alert(`「${teamName}」をチームマスタから削除しました。`);
  } catch (e) {
    console.error("チームマスタ削除に失敗しました", e);
    alert("チームマスタの削除に失敗しました。");
  }
}

// Firebaseのチームマスタを全PCで共有
TEAM_MASTERS_REF.on("value", snapshot => {
  const raw = snapshot.val() || {};
  const fromFirebase = {};
  Object.values(raw).forEach(master => {
    const fullName = String(master?.teamInfo?.fullName || "").trim();
    if (!fullName) return;
    fromFirebase[fullName] = {
      teamInfo: {
        fullName,
        shortName: String(master?.teamInfo?.shortName || "").trim(),
        teamLogoFile: String(master?.teamInfo?.teamLogoFile || "").trim()
      },
      players: Array.isArray(master?.players) ? master.players : []
    };
  });
  teamMastersCache = fromFirebase;
  localStorage.setItem(TEAM_MASTER_KEY, JSON.stringify(teamMastersCache));
  if (masterEditSide && document.getElementById("masterModal")?.classList.contains("show")) {
    renderMasterRows();
  }
});

<!-- ===== 画面自動フィット：既存機能・配置は変更しない ===== -->
<script>
(function () {
  const FIT_MARGIN = 36;
  const MAX_SCALE = 1;
  const MIN_SCALE = 0.55;

  function fitControlPanel() {
    const wrap = document.getElementById('panelWrap');
    if (!wrap) return;

    // いったん100%に戻して、本来の必要サイズを測る
    wrap.style.zoom = '1';

    const naturalWidth = wrap.scrollWidth;
    const naturalHeight = wrap.scrollHeight;
    const availableWidth = Math.max(320, window.innerWidth - FIT_MARGIN * 2);
    const availableHeight = Math.max(320, window.innerHeight - FIT_MARGIN * 2);

    if (!naturalWidth || !naturalHeight) return;

    const widthScale = availableWidth / naturalWidth;
    const heightScale = availableHeight / naturalHeight;
    const scale = Math.max(
      MIN_SCALE,
      Math.min(MAX_SCALE, widthScale, heightScale)
    );

    wrap.style.zoom = String(scale);
  }

  let fitTimer = null;
  function scheduleFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitControlPanel, 30);
  }

  window.addEventListener('load', fitControlPanel);
  window.addEventListener('resize', scheduleFit);

  // 初期描画後にも再計算
  requestAnimationFrame(() => requestAnimationFrame(fitControlPanel));
})();
</script>

<script id="ipad-control-fit-script">
(function(){
  const mq = window.matchMedia('(max-width: 1200px) and (pointer: coarse)');
  let timer;
  function fit(){
    document.body.style.zoom = '';
    if(!mq.matches) return;
    const wrap = document.getElementById('panelWrap');
    if(!wrap) return;
    // 現行の横並び配置を維持し、画面幅に収まる倍率だけ適用する。
    const contentWidth = Math.max(wrap.scrollWidth + 48, wrap.getBoundingClientRect().width + 48);
    const available = document.documentElement.clientWidth;
    const scale = Math.min(1, available / contentWidth);
    document.body.style.zoom = String(scale);
  }
  function scheduleFit(){ clearTimeout(timer); timer=setTimeout(fit, 80); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fit,{once:true});
  else fit();
  window.addEventListener('resize',scheduleFit);
  window.addEventListener('orientationchange',scheduleFit);
})();
</script>
